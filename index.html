<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Family Chart Sample</title>
  <script src="https://unpkg.com/d3@7"></script>
  <script type="module" src="https://unpkg.com/family-chart@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@latest/dist/styles/family-chart.css">
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
    }

    header {
      max-width: 1200px;
      margin: 1.5rem auto 0.75rem;
      padding: 0 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
    }

    p {
      margin: 0.4rem 0 0;
      color: #94a3b8;
      line-height: 1.35;
      max-width: 80ch;
    }

    #FamilyChart {
      width: min(1200px, 100vw - 2rem);
      height: 80vh;
      margin: 0 auto 1.5rem;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid #334155;
      box-shadow: 0 16px 32px rgba(2, 6, 23, 0.45);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>
<header>
  <h1>Sample Family Chart — Multi-Generation Demo</h1>
  <p>
    A larger sample with grandparents, siblings, spouses, cousins, and grandchildren.
    Use mouse wheel or pinch to zoom and drag to explore branches.
  </p>
</header>
<div id="FamilyChart" class="f3"></div>

<script type="module">
  const data = [
    { id: '1', data: { 'first name': 'Edward', 'last name': 'Parker', birthday: '1938', gender: 'M', role: 'Grandfather' }, rels: { spouses: ['2'], children: ['3', '4'] } },
    { id: '2', data: { 'first name': 'Margaret', 'last name': 'Parker', birthday: '1941', gender: 'F', role: 'Grandmother' }, rels: { spouses: ['1'], children: ['3', '4'] } },

    { id: '3', data: { 'first name': 'Thomas', 'last name': 'Parker', birthday: '1963', gender: 'M', role: 'Father' }, rels: { parents: ['1', '2'], spouses: ['5'], children: ['7', '8', '9'] } },
    { id: '4', data: { 'first name': 'Sarah', 'last name': 'Parker', birthday: '1966', gender: 'F', role: 'Aunt' }, rels: { parents: ['1', '2'], spouses: ['6'], children: ['10', '11'] } },

    { id: '5', data: { 'first name': 'Elena', 'last name': 'Parker', birthday: '1964', gender: 'F', role: 'Mother' }, rels: { spouses: ['3'], children: ['7', '8', '9'] } },
    { id: '6', data: { 'first name': 'Victor', 'last name': 'Lopez', birthday: '1965', gender: 'M', role: 'Uncle' }, rels: { spouses: ['4'], children: ['10', '11'] } },

    { id: '7', data: { 'first name': 'Maya', 'last name': 'Parker', birthday: '1988', gender: 'F', role: 'Daughter' }, rels: { parents: ['3', '5'], spouses: ['12'], children: ['14', '15'] } },
    { id: '8', data: { 'first name': 'Noah', 'last name': 'Parker', birthday: '1991', gender: 'M', role: 'Son' }, rels: { parents: ['3', '5'] } },
    { id: '9', data: { 'first name': 'Ava', 'last name': 'Parker', birthday: '1995', gender: 'F', role: 'Daughter' }, rels: { parents: ['3', '5'], spouses: ['13'] } },

    { id: '10', data: { 'first name': 'Lucas', 'last name': 'Lopez', birthday: '1992', gender: 'M', role: 'Cousin' }, rels: { parents: ['4', '6'] } },
    { id: '11', data: { 'first name': 'Isabella', 'last name': 'Lopez', birthday: '1996', gender: 'F', role: 'Cousin' }, rels: { parents: ['4', '6'] } },

    { id: '12', data: { 'first name': 'Daniel', 'last name': 'Kim', birthday: '1987', gender: 'M', role: 'Son-in-law' }, rels: { spouses: ['7'], children: ['14', '15'] } },
    { id: '13', data: { 'first name': 'Ethan', 'last name': 'Reed', birthday: '1993', gender: 'M', role: 'Son-in-law' }, rels: { spouses: ['9'] } },

    { id: '14', data: { 'first name': 'Lena', 'last name': 'Kim', birthday: '2016', gender: 'F', role: 'Granddaughter' }, rels: { parents: ['7', '12'] } },
    { id: '15', data: { 'first name': 'Owen', 'last name': 'Kim', birthday: '2019', gender: 'M', role: 'Grandson' }, rels: { parents: ['7', '12'] } }
  ]

  const chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(700)
    .setCardXSpacing(260)
    .setCardYSpacing(170)

  chart.setCardHtml()
    .setCardDisplay([
      ['first name', 'last name'],
      ['role'],
      ['birthday']
    ])

  chart.updateTree({ initial: true })
</script>
</body>
</html>
