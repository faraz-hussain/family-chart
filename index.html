<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Family Chart Sample</title>
  <script src="https://unpkg.com/d3@7"></script>
  <script type="module" src="https://unpkg.com/family-chart@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@latest/dist/styles/family-chart.css">
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      max-width: 1100px;
      margin: 1.5rem auto 0.75rem;
      padding: 0 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    p {
      margin: 0.4rem 0 0;
      color: #94a3b8;
    }

    #FamilyChart {
      width: min(1100px, 100vw - 2rem);
      height: 78vh;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #334155;
      box-shadow: 0 16px 32px rgba(2, 6, 23, 0.45);
    }
  </style>
</head>
<body>
<header>
  <h1>Sample Family Chart</h1>
  <p>Interactive family tree with parents, spouses, and children.</p>
</header>
<div id="FamilyChart" class="f3"></div>

<script type="module">
  const data = [
    {
      id: '1',
      data: { 'first name': 'Thomas', 'last name': 'Parker', birthday: '1958', gender: 'M' },
      rels: { spouses: ['2'], children: ['3', '4'] }
    },
    {
      id: '2',
      data: { 'first name': 'Elena', 'last name': 'Parker', birthday: '1960', gender: 'F' },
      rels: { spouses: ['1'], children: ['3', '4'] }
    },
    {
      id: '3',
      data: { 'first name': 'Maya', 'last name': 'Parker', birthday: '1986', gender: 'F' },
      rels: { parents: ['1', '2'], spouses: ['5'], children: ['6'] }
    },
    {
      id: '4',
      data: { 'first name': 'Noah', 'last name': 'Parker', birthday: '1989', gender: 'M' },
      rels: { parents: ['1', '2'] }
    },
    {
      id: '5',
      data: { 'first name': 'Daniel', 'last name': 'Kim', birthday: '1985', gender: 'M' },
      rels: { spouses: ['3'], children: ['6'] }
    },
    {
      id: '6',
      data: { 'first name': 'Lena', 'last name': 'Kim', birthday: '2016', gender: 'F' },
      rels: { parents: ['3', '5'] }
    }
  ]

  const chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(700)
    .setCardXSpacing(240)
    .setCardYSpacing(140)

  chart.setCardHtml()
    .setCardDisplay([
      ['first name', 'last name'],
      ['birthday']
    ])

  chart.updateTree({ initial: true })
</script>
</body>
</html>
