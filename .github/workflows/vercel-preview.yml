name: Vercel Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel secrets availability
        id: vercel-secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.vercel-secrets.outputs.has_secrets == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: steps.vercel-secrets.outputs.has_secrets == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy PR preview to Vercel
        if: steps.vercel-secrets.outputs.has_secrets == 'true'
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"

          DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Unable to parse Vercel deployment URL from CLI output" >&2
            exit 1
          fi

          for i in $(seq 1 30); do
            STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL" || true)
            if [ "$STATUS_CODE" != "404" ] && [ "$STATUS_CODE" != "000" ]; then
              break
            fi
            sleep 2
          done

          echo "preview_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Upsert preview URL comment on PR
        uses: actions/github-script@v7
        env:
          HAS_SECRETS: ${{ steps.vercel-secrets.outputs.has_secrets }}
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- vercel-preview-comment -->'
            const hasSecrets = process.env.HAS_SECRETS === 'true'
            const body = hasSecrets
              ? `${marker}\n✅ Vercel preview ready: ${process.env.PREVIEW_URL}`
              : `${marker}\n⚠️ Vercel preview skipped: required repository secrets are unavailable for this run.`

            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            })

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              })
            }
